name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile-check every hook script
        run: python -m py_compile hooks/*/*.py

      - name: Run tests
        run: pytest -v tests/

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shellcheck ships preinstalled on GitHub-hosted ubuntu-latest runners --
      # no marketplace action needed for a repo this size.
      - name: shellcheck install.sh and every hook's setup.sh
        run: shellcheck install.sh hooks/*/setup.sh
