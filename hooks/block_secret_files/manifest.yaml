name: block_secret_files.py
version: 0.1.0
status: ready
fail_mode: open
description: >
  Blocks direct Read/Bash-cat access to secret-bearing files (.env, .pem,
  id_rsa/id_ed25519, credentials.json, secrets.*, .key, frp*.toml,
  /etc/shadow, /etc/gshadow, shell rc-files, etc.) so raw secret material
  never lands in the transcript. Promoted from a fleet-local hook -- the
  path-pattern/verb matching logic carries over as-is, and the docstring
  has been rewritten to drop real incident/service names.
